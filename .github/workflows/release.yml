# Build a signed release APK and (optionally) attach it to a GitHub Release.
#
# Triggered by:
#   - pushing a `v*` tag (e.g. `v0.1.0`)        → builds + uploads artefact + creates a GitHub Release
#   - workflow_dispatch from the Actions tab    → builds + uploads artefact only
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   WHISPER_KEYSTORE_BASE64   — `base64 -w0 whisper-android-release.jks`
#   WHISPER_KEYSTORE_PASSWORD — keystore password
#   WHISPER_KEY_PASSWORD      — key password
#   (alias defaults to `whisper-android` — override with WHISPER_KEYSTORE_ALIAS if you need to)
#
# See README §"Building a release APK" for the local-build counterpart.

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # required by softprops/action-gh-release

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.3.11579264 cmake;3.22.1'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.WHISPER_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::WHISPER_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          mkdir -p "$HOME/.android/keystores"
          echo "$KEYSTORE_B64" | base64 -d > "$HOME/.android/keystores/whisper-android-release.jks"
          # sanity-check
          file "$HOME/.android/keystores/whisper-android-release.jks"

      - name: Assemble release APK
        env:
          WHISPER_KEYSTORE_PATH: ${{ env.HOME }}/.android/keystores/whisper-android-release.jks
          WHISPER_KEYSTORE_PASSWORD: ${{ secrets.WHISPER_KEYSTORE_PASSWORD }}
          WHISPER_KEYSTORE_ALIAS: ${{ secrets.WHISPER_KEYSTORE_ALIAS || 'whisper-android' }}
          WHISPER_KEY_PASSWORD: ${{ secrets.WHISPER_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify signature
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: Compute SHA-256
        id: sha
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          DIGEST=$(sha256sum "$APK" | awk '{print $1}')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "APK digest: $DIGEST"

      - name: Scrub keystore from runner
        if: always()
        run: rm -f "$HOME/.android/keystores/whisper-android-release.jks"

      - name: Upload APK as workflow artefact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          body: |
            Whisper Android — signed release APK.

            **APK SHA-256:** `${{ steps.sha.outputs.digest }}`
